name: 'Delegate Action'
description: 'A GitHub Action that uses GitHub Models to delegate tasks, create PRs, and assign reviewers'
author: 'ChecKMarKDevTools'
branding:
  icon: 'git-pull-request'
  color: 'blue'

inputs:
  MODEL:
    description: 'GitHub Models model name (e.g. gpt-4o, gpt-4o-mini, o3-mini)'
    required: false
    default: 'gpt-4o'
  filename:
    description: 'Optional filename in the repository to process'
    required: false
    default: ''
  branch:
    description: 'Optional branch to work on'
    required: false
    default: 'main'

runs:
  using: 'node20'
  main: 'dist/index.js'
