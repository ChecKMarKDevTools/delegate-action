name: 'Delegate Action'
description: 'A GitHub Action that uses a pluggable LLM provider to delegate tasks, create PRs, and assign reviewers'
author: 'ChecKMarKDevTools'
branding:
  icon: 'git-pull-request'
  color: 'blue'

inputs:
  LLM_PROVIDER:
    description: 'LLM provider to use (openai, anthropic, copilot)'
    required: true
  LLM_API_KEY:
    description: 'API key for the chosen LLM provider (OpenAI key, Anthropic key, or GitHub PAT for copilot)'
    required: true
  LLM_MODEL:
    description: 'Optional model override for the LLM provider'
    required: false
    default: ''
  filename:
    description: 'Optional filename in the repository to process'
    required: false
    default: ''
  branch:
    description: 'Optional branch to work on'
    required: false
    default: 'main'

runs:
  using: 'node20'
  main: 'dist/index.js'
